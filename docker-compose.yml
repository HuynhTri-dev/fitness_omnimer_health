services:
  # 1. 🌐 Node.js Backend Server (omnimer_health_server)
  backend:
    container_name: omnimer_health_backend
    build:
      context: ./omnimer_health_server
      dockerfile: Dockerfile
      target: builder # Sử dụng stage builder để có đầy đủ node_modules
    command: npm run dev # Chạy nodemon để hot-reload
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./omnimer_health_server/.env
    environment:
      - PORT=8000
      - NODE_ENV=development
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - AI_API=http://omnimer_health_ai:8888
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - omnimer_network
    depends_on:
      - ai_service
    volumes:
      - ./omnimer_health_server:/app
      - /app/node_modules # Giữ lại node_modules của container (Linux) tránh xung đột Windows

  # 2. 🤖 Python AI/FastAPI Service (3T-FIT)
  ai_service:
    container_name: omnimer_health_ai
    build:
      context: ./3T-FIT
      dockerfile: Dockerfile
    command: uvicorn ai_server.app.main:app --host 0.0.0.0 --port 8888 --reload
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - omnimer_network
    volumes:
      - ./3T-FIT:/app

  # 3. 🖥️ Admin Dashboard (React/Vite)
  admin_page:
    container_name: omnimer_admin_page
    build:
      context: ./adminpage
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5137:80"
    networks:
      - omnimer_network

networks:
  omnimer_network:
    driver: bridge
